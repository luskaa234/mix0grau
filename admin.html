<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mix0Grau - Central de Gestao</title>
<style>
:root{font-family:system-ui,Arial;--p:#57096b;--bg:#f6f4f8;--line:#e6dfea;--muted:#786c7d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#27172c}
header{position:sticky;top:0;z-index:20;background:var(--p);color:white;padding:15px 20px;display:flex;align-items:center;gap:15px;justify-content:space-between;flex-wrap:wrap;box-shadow:0 3px 18px #22002722}
header b{font-size:21px}header small{display:block;opacity:.8}header>div:last-child{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
input,select,button,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}header input{max-width:165px;border:0;border-radius:8px;padding:10px}
.store-link{color:white;text-decoration:none;border:1px solid #ffffff70;padding:10px 12px;border-radius:9px;font-size:13px;font-weight:700}
.layout{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:calc(100vh - 76px)}
nav{position:sticky;top:80px;align-self:start;height:calc(100dvh - 80px);overflow:auto;background:#fff;border-right:1px solid var(--line);padding:15px;display:flex;flex-direction:column;gap:5px}
.navtitle{font-size:10px;font-weight:900;letter-spacing:1.3px;color:#9a8b9e;padding:10px 12px}
nav button{border:0;background:none;text-align:left;padding:12px;border-radius:9px;font-weight:700;color:#44344a;min-height:45px}
nav button.active{background:#f2e4f6;color:var(--p)}
main{padding:24px;max-width:1500px;width:100%;min-width:0}h1{font-size:25px;margin:0 0 20px}h2{font-size:18px;margin:0 0 14px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:17px;margin-bottom:15px;box-shadow:0 2px 10px #25062e09}
.stat strong{display:block;font-size:25px;color:var(--p)}.stat span{font-size:12px;color:#74677a}.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:700px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #eee;font-size:13px;vertical-align:top}th{color:#73687a}td button,td select{margin:2px}
.form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid #ddd2e0;padding:10px;border-radius:8px;background:white;max-width:100%}.field textarea{min-height:72px;resize:vertical}
.primary{background:var(--p);color:white;border:0;border-radius:9px;padding:10px 15px;font-weight:800}.secondary{border:1px solid #ddd;background:white;border-radius:8px;padding:8px 10px}
.danger{color:#a52222}.muted{color:var(--muted);font-size:12px}.notice{background:#fff2d5;padding:12px;border-radius:9px;margin-bottom:14px;font-size:13px}
#msg{position:fixed;bottom:18px;right:18px;background:#25202a;color:white;padding:12px 18px;border-radius:10px;display:none;max-width:90vw;z-index:50}.rowActions{display:flex;gap:6px;flex-wrap:wrap}.compact{max-width:150px}
@media(max-width:800px){header{position:relative;padding:13px 15px}header b{font-size:18px}header input{width:135px}.layout{display:block}nav{position:sticky;top:0;z-index:12;height:auto;display:flex;flex-direction:row;overflow-x:auto;white-space:nowrap;padding:9px 12px;gap:7px;border-bottom:1px solid var(--line);box-shadow:0 2px 10px #0001}.navtitle{display:none}nav button{flex:none;padding:10px 13px;border:1px solid #eee;min-height:40px}main{padding:16px 12px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:14px}.form{grid-template-columns:repeat(2,1fr)}}
@media(max-width:430px){.stats{grid-template-columns:1fr}.form{grid-template-columns:1fr}header>div:last-child{width:100%}header input{flex:1}}
</style>
</head>
<body>
<header>
  <div><b>Mix0Grau - Gestao</b><small>Pedidos, produtos, estoque e fidelidade</small></div>
  <div><input type="password" id="pin" placeholder="PIN administrador"><button class="primary" onclick="load()">Acessar gestao</button><button class="secondary" onclick="forgetPin()">Sair</button><a class="store-link" href="/" target="_blank" rel="noopener">Ver cardapio</a></div>
</header>
<div class="layout"><nav id="nav"><div class="navtitle">MENU DE GESTAO</div><button class="active" onclick="tab('dashboard',this)">Dashboard</button><button onclick="tab('orders',this)">Pedidos</button><button onclick="tab('products',this)">Produtos e sabores</button><button onclick="tab('stock',this)">Estoque</button><button onclick="tab('finance',this)">Financeiro</button><button onclick="tab('clients',this)">Clientes e fidelidade</button></nav><main><h1 id="heading">Dashboard</h1><div id="content"><div class="card">Informe seu PIN e clique em Acessar gestao.</div></div></main></div>
<div id="msg"></div>
<script>
const PIN_KEY='mix0grau_admin_pin';
let section='dashboard',products=[],orders=[],clients=[],stats={},expenses=[],movements=[];
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const phoneDigits=s=>String(s||'').replace(/\D/g,'');
const formatPhone=s=>{const n=phoneDigits(s);return n.length>=11?'('+n.slice(0,2)+') '+n.slice(2,7)+'-'+n.slice(7,11):n};
function toast(s){let e=document.getElementById('msg');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',4500)}
function currentPin(){return document.getElementById('pin').value.trim()}
function rememberPin(){if(currentPin())localStorage.setItem(PIN_KEY,currentPin())}
function forgetPin(){localStorage.removeItem(PIN_KEY);document.getElementById('pin').value='';stats={};products=[];orders=[];clients=[];expenses=[];movements=[];document.getElementById('content').innerHTML='<div class="card">PIN removido deste navegador.</div>';toast('Acesso removido')}
async function api(path,data){let res=await fetch(path,{method:data?'POST':'GET',headers:{'Content-Type':'application/json','X-Admin-Pin':currentPin()},body:data?JSON.stringify(data):undefined});let raw=await res.text(),v;try{v=JSON.parse(raw)}catch{throw Error('Servidor retornou resposta invalida. Verifique se executou py server.py.')}if(!res.ok)throw Error(v.error||'Falha na operacao');return v}
async function load(){try{[stats,products,orders,clients,expenses,movements]=await Promise.all(['/api/admin/erp/dashboard','/api/admin/erp/products','/api/admin/orders','/api/admin/erp/clients','/api/admin/erp/expenses','/api/admin/erp/movements'].map(x=>api(x)));rememberPin();render();toast('Painel carregado')}catch(e){toast(e.message)}}
function tab(x,b){section=x;document.querySelectorAll('nav button').forEach(t=>t.classList.remove('active'));b.classList.add('active');render()}
function render(){document.getElementById('heading').textContent={dashboard:'Visao geral',orders:'Controle de pedidos',products:'Produtos e sabores',stock:'Controle de estoque',finance:'Financeiro',clients:'Clientes e fidelidade'}[section];document.getElementById('content').innerHTML=({dashboard:dash,orders:orderView,products:productView,stock:stockView,finance:financeView,clients:clientView})[section]()}
function productName(id){return products.find(p=>Number(p.id)===Number(id))?.name||('Produto #'+id)}
function parseItems(o){try{return JSON.parse(o.items||'[]')}catch{return []}}
function dash(){return `<div class="stats">${[['Faturamento aprovado',money(stats.revenue)],['Pedidos pendentes',stats.pending||0],['Acais vendidos',stats.units||0],['Clientes',stats.clients||0]].map(x=>`<div class="card stat"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div><div class="card"><h2>Resumo financeiro</h2><p>Receitas aprovadas: <b>${money(stats.revenue)}</b> - Despesas lancadas: <b>${money(stats.expenses)}</b></p><p>Saldo simples: <b>${money((stats.revenue||0)-(stats.expenses||0))}</b></p><p class="muted">Saldo nao equivale a lucro contabil: nao inclui todos os custos, impostos e taxas.</p></div><div class="card"><h2>Alerta de estoque</h2>${stats.low_stock?.length?stats.low_stock.map(p=>`<p>${esc(p.name)} - ${p.stock} disponiveis (minimo ${p.low_stock})</p>`).join(''):'Nenhum alerta'}</div>`}
function orderView(){return `<div class="card tablewrap"><table><tr><th>#</th><th>Cliente</th><th>Itens</th><th>Valor</th><th>Status</th><th>Acao</th></tr>${orders.map(o=>`<tr><td>${o.id}<div class="muted">${esc(o.created)}</div></td><td>${esc(o.name)}<div class="muted">${esc(formatPhone(o.phone))}</div>${o.address?`<div class="muted">${esc(o.address)}</div>`:''}</td><td>${parseItems(o).map(i=>`${i.qty}x ${esc(productName(i.product))} (${i.size?'500':'350'} ml)`).join('<br>')}</td><td>${money(o.total)}<div class="muted">${o.units} un.</div></td><td><select id="ostatus${o.id}" class="compact"><option value="pending" ${o.status==='pending'?'selected':''}>Pendente</option><option value="approved" ${o.status==='approved'?'selected':''}>Aprovado</option><option value="rejected" ${o.status==='rejected'?'selected':''}>Recusado</option></select></td><td><button class="secondary" onclick="saveOrderStatus(${o.id})">Salvar</button></td></tr>`).join('')}</table></div>`}
async function saveOrderStatus(id){try{await api('/api/admin/order_status',{id,status:document.getElementById('ostatus'+id).value});await load();toast('Pedido atualizado')}catch(e){toast(e.message)}}
function productView(){return `<div class="card"><h2>Cadastrar ou editar sabor</h2><form class="form" onsubmit="saveProduct(event)"><input type="hidden" id="pid"><div class="field"><label>Nome do sabor</label><input id="pname" required></div><div class="field"><label>Descricao</label><input id="pdesc"></div><div class="field"><label>Categoria</label><input id="pcat" value="Acai"></div><div class="field"><label>Garrafa 350 ml (R$)</label><input id="p350" type="number" min="0" step="0.01" required></div><div class="field"><label>Garrafa 500 ml (R$)</label><input id="p500" type="number" min="0" step="0.01" required></div><div class="field"><label>Custo estimado (R$)</label><input id="pcost" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Estoque minimo</label><input id="plow" type="number" min="0" value="5"></div><div class="field"><label>Situacao</label><select id="pactive"><option value="1">Ativo</option><option value="0">Inativo</option></select></div><div class="field"><label>&nbsp;</label><div class="rowActions"><button class="primary" type="submit">Salvar produto</button><button class="secondary" type="button" onclick="clearProduct()">Novo</button></div></div></form></div><div class="card tablewrap"><h2>Sabores cadastrados</h2><table><tr><th>Produto</th><th>Categoria</th><th>350 ml</th><th>500 ml</th><th>Estoque</th><th>Status</th><th>Acao</th></tr>${products.map(p=>`<tr><td>${esc(p.name)}<div class="muted">${esc(p.description)}</div></td><td>${esc(p.category)}</td><td>${money(p.price350)}</td><td>${money(p.price500)}</td><td>${p.stock}</td><td>${p.active?'Ativo':'Inativo'}</td><td><button class="secondary" onclick="editProduct(${p.id})">Editar</button></td></tr>`).join('')}</table></div>`}
function clearProduct(){['pid','pname','pdesc','pcat','p350','p500','pcost','plow'].forEach(id=>document.getElementById(id).value='');document.getElementById('pcat').value='Acai';document.getElementById('pcost').value='0';document.getElementById('plow').value='5';document.getElementById('pactive').value='1'}
function editProduct(id){let p=products.find(x=>x.id===id);for(let [key,value] of Object.entries({pid:p.id,pname:p.name,pdesc:p.description,pcat:p.category,p350:p.price350,p500:p.price500,pcost:p.cost,plow:p.low_stock,pactive:p.active}))document.getElementById(key).value=value??'';window.scrollTo({top:0,behavior:'smooth'})}
async function saveProduct(e){e.preventDefault();let get=id=>document.getElementById(id).value;try{await api('/api/admin/erp/product',{id:get('pid')||null,name:get('pname'),description:get('pdesc'),category:get('pcat'),price350:get('p350'),price500:get('p500'),cost:get('pcost'),low_stock:get('plow'),active:get('pactive')==='1'});await load();section='products';render();toast('Produto salvo')}catch(e){toast(e.message)}}
function stockView(){return `<div class="card"><h2>Registrar entrada ou saida</h2><form class="form" onsubmit="saveStock(event)"><div class="field"><label>Produto</label><select id="stockProduct">${products.map(p=>`<option value="${p.id}">${esc(p.name)} (atual: ${p.stock})</option>`).join('')}</select></div><div class="field"><label>Quantidade (+ entrada / - saida)</label><input id="delta" type="number" step="0.01" required placeholder="Ex.: 10 ou -2"></div><div class="field"><label>Motivo</label><input id="reason" placeholder="Compra, perda, ajuste..."></div><div><button class="primary">Registrar movimentacao</button></div></form></div><div class="card tablewrap"><h2>Movimentacoes recentes</h2><table><tr><th>Data</th><th>Produto</th><th>Quantidade</th><th>Motivo</th></tr>${movements.map(m=>`<tr><td>${esc(m.created)}</td><td>${esc(m.name)}</td><td>${m.delta}</td><td>${esc(m.reason)}</td></tr>`).join('')}</table></div>`}
async function saveStock(e){e.preventDefault();try{await api('/api/admin/erp/stock',{id:+document.getElementById('stockProduct').value,delta:+document.getElementById('delta').value,reason:document.getElementById('reason').value});await load();section='stock';render();toast('Estoque atualizado')}catch(e){toast(e.message)}}
function financeView(){return `<div class="stats"><div class="card stat"><span>Vendas aprovadas</span><strong>${money(stats.revenue)}</strong></div><div class="card stat"><span>Despesas</span><strong>${money(stats.expenses)}</strong></div></div><div class="card"><h2>Lancar ou editar despesa</h2><form class="form" onsubmit="saveExpense(event)"><input type="hidden" id="eid"><div class="field"><label>Descricao</label><input id="edesc" required></div><div class="field"><label>Valor (R$)</label><input id="eamount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Categoria</label><select id="ecat"><option>Ingredientes</option><option>Embalagens</option><option>Energia</option><option>Aluguel</option><option>Outros</option></select></div><div><button class="primary">Salvar despesa</button><button class="secondary" type="button" onclick="clearExpense()">Nova</button></div></form></div><div class="card tablewrap"><h2>Ultimas despesas</h2><table><tr><th>Data</th><th>Descricao</th><th>Categoria</th><th>Valor</th><th>Acao</th></tr>${expenses.map(x=>`<tr><td>${esc(x.created)}</td><td>${esc(x.description)}</td><td>${esc(x.category)}</td><td>${money(x.amount)}</td><td><button class="secondary" onclick="editExpense(${x.id})">Editar</button><button class="secondary danger" onclick="deleteExpense(${x.id})">Apagar</button></td></tr>`).join('')}</table></div>`}
function clearExpense(){['eid','edesc','eamount'].forEach(id=>document.getElementById(id).value='');document.getElementById('ecat').value='Ingredientes'}
function editExpense(id){let x=expenses.find(e=>e.id===id);document.getElementById('eid').value=x.id;document.getElementById('edesc').value=x.description;document.getElementById('eamount').value=x.amount;document.getElementById('ecat').value=x.category||'Outros';window.scrollTo({top:0,behavior:'smooth'})}
async function saveExpense(e){e.preventDefault();let id=document.getElementById('eid').value;let data={id,description:document.getElementById('edesc').value,amount:+document.getElementById('eamount').value,category:document.getElementById('ecat').value};try{await api(id?'/api/admin/erp/expense_edit':'/api/admin/erp/expense',data);await load();section='finance';render();toast('Despesa salva')}catch(e){toast(e.message)}}
async function deleteExpense(id){if(!confirm('Apagar esta despesa?'))return;try{await api('/api/admin/erp/expense_delete',{id});await load();section='finance';render();toast('Despesa apagada')}catch(e){toast(e.message)}}
function clientView(){return `<div class="card"><h2>Editar cliente</h2><form class="form" onsubmit="saveClient(event)"><input type="hidden" id="cid"><div class="field"><label>Nome</label><input id="cname" required></div><div class="field"><label>WhatsApp</label><input id="cphone" required placeholder="DDD + numero"></div><div class="field"><label>Endereco</label><textarea id="caddress" placeholder="Endereco para entrega"></textarea></div><div><button class="primary">Salvar cliente</button><button type="button" class="secondary" onclick="clearClient()">Limpar</button></div></form></div><div class="card"><h2>Resgatar premio</h2><div class="notice">Cada 6 unidades de acai em pedidos aprovados geram 1 premio. O resgate deve ser confirmado pela loja.</div><form class="form" onsubmit="redeem(event)"><div class="field"><label>WhatsApp do cliente</label><input id="rphone" required placeholder="DDD + numero"></div><div><label>&nbsp;</label><button class="primary">Confirmar resgate</button></div></form></div><div class="card tablewrap"><h2>Clientes cadastrados</h2><table><tr><th>Nome</th><th>WhatsApp</th><th>Endereco</th><th>Selos</th><th>Premios</th><th>Acao</th></tr>${clients.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(formatPhone(c.phone))}</td><td>${esc(c.address||'')}</td><td>${c.stamps}/6</td><td>${c.rewards}</td><td><button class="secondary" onclick="editClient(${c.id})">Editar</button></td></tr>`).join('')}</table></div>`}
function clearClient(){['cid','cname','cphone','caddress'].forEach(id=>document.getElementById(id).value='')}
function editClient(id){let c=clients.find(x=>x.id===id);document.getElementById('cid').value=c.id;document.getElementById('cname').value=c.name;document.getElementById('cphone').value=formatPhone(c.phone);document.getElementById('caddress').value=c.address||'';window.scrollTo({top:0,behavior:'smooth'})}
async function saveClient(e){e.preventDefault();try{await api('/api/admin/erp/client',{id:document.getElementById('cid').value,name:document.getElementById('cname').value,phone:document.getElementById('cphone').value,address:document.getElementById('caddress').value});await load();section='clients';render();toast('Cliente salvo')}catch(e){toast(e.message)}}
async function redeem(e){e.preventDefault();if(!confirm('Confirmar entrega do premio?'))return;try{await api('/api/admin/redeem',{phone:document.getElementById('rphone').value});await load();section='clients';render();toast('Premio resgatado')}catch(e){toast(e.message)}}
document.addEventListener('DOMContentLoaded',()=>{let saved=localStorage.getItem(PIN_KEY);if(saved){document.getElementById('pin').value=saved;load()}});
</script>
</body>
</html>
